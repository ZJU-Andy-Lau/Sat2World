  affine_trans_scale: 30.0
  height_anchor_scale: 200.0
  height_local_scale: 30.0
  height_z_max: 4.0
  point_bins_latlon: 33
  geometry_feature_dim: 30
  point_bin_size_latlon: 0.1
  point_fine_range_latlon: 0.05
  center_downsample_stage_steps:
  - 0
  - 100
  - 200
  center_downsample_factors:
  - 4
  - 2
  - 1
  enable_gaussian_branch: false
  enable_early_heads: true
  sh_dim: 48
  gaussian_scale_epsilon: 0.0001
  output_raw_logits: true
  early_match_dim: 256
  early_match_residual_hidden_dim: 512
  early_match_residual_scale: 16.0
  early_match_enable_residual: true
  early_projection_hidden_dim: 512
  early_height_hidden_dim: 512
  early_height_scale: 1000.0
loss:
