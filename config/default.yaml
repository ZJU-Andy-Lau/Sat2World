system:
  project_name: Sat2World
  experiment_name: default_exp
  work_dir: work_dirs/sat2world_default
  output_dir: work_dirs/sat2world_default
  seed: 42
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  device: cuda
  compile_model: false
  ddp_backend: nccl
  auto_resume: true
  resume_path: ""
  checkpoint_path: ""
  eval_only: false

data:
  train:
    root: train_data
    max_view_num: 4
    samples_per_scene: 10
    min_views: 2
    apply_perturbation: true
    synthetic_perturbation_in_eval: false
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 12345
    reference_policy: first
    strict_same_hw: true
    crop_size: 512
    perturb_cfg:
      tx_range: [ -2.0, 2.0 ]
      ty_range: [ -2.0, 2.0 ]
      scale_range: [ -0.0005, 0.0005 ]
      shear_range: [ -0.0005, 0.0005 ]
  val:
    root: test_data
    max_view_num: 4
    samples_per_scene: 1
    min_views: 2
    apply_perturbation: false
    synthetic_perturbation_in_eval: false
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 22345
    reference_policy: first
    strict_same_hw: true
    crop_size: 512
    perturb_cfg:
      tx_range: [ -2.0, 2.0 ]
      ty_range: [ -2.0, 2.0 ]
      scale_range: [ -0.0005, 0.0005 ]
      shear_range: [ -0.0005, 0.0005 ]
  test:
    root: test_data
    crop_size: 512
  loader:
    batch_size: 1
    val_batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2
    drop_last: true

geometry:
  rpc_dtype: float64
  net_dtype: float32

model:
  dino_weight_path: "path/to/dinov3_vitl16_pretrain.pth"
  pretrained: true
  freeze_backbone: true
  patch_size: 16
  embed_dim: 1024
  geometry_token_dim: 256
  fusion_dim: 1024
  encoder_depth: 4
  encoder_num_heads: 8
  encoder_ffn_ratio: 4.0
  encoder_dropout: 0.0
  affine_diag_scale: 0.05
  affine_offdiag_scale: 0.05
  affine_trans_scale: 4.0
  height_bins: 33
  height_bin_size: 1.0
  height_fine_range: 0.5
  point_bins: 33
  point_bin_size_xy: 2.0
  point_bin_size_z: 1.0
  point_fine_range_xy: 1.0
  point_fine_range_z: 0.5
  sh_dim: 48
  gaussian_scale_epsilon: 1.0e-4
  output_raw_logits: true

renderer:
  train_num_target_views: 1
  val_num_target_views: 1
  use_all_targets_in_val: false
  exclude_self_source: true
  allow_self_source_if_single_view: true
  source_stride: 4
  confidence_threshold: 0.1
  topk_per_target: 4000
  enable_voxelization: false
  voxel_xy: 2.0
  voxel_z: 1.0
  render_downsample_factor_train: 4
  render_downsample_factor_val: 2
  nsigma: 2.5
  alpha_clamp_max: 0.98
  eps_xy_fd: 0.01
  eps_h_fd: 0.1
  eps_cov: 1.0e-4
  depth_dir_delta_h: 10.0
  depth_sort_descending: false
  chunk_size: 512
  alpha_cov_thresh: 0.05
  render_compute_dtype: fp16
  deterministic_target_selection: true

loss:
  warmup_steps_geom_only: 1000
  render_ramp_steps: 2000
  ramp_mode: linear
  lambda_affine_grid: 1.0
  lambda_affine_pair: 1.0
  lambda_affine_reg: 0.1
  lambda_affine_ref: 0.1
  lambda_height: 1.0
  lambda_point: 1.0
  lambda_center: 0.2
  lambda_opacity_reg: 0.01
  lambda_scale_reg: 0.01
  lambda_render_rpc: 1.0
  lambda_render_point: 1.0
  render_rgb_l1: 1.0
  render_rgb_ssim: 0.2
  render_height: 0.5
  render_alpha: 0.01
  height_beta: 1.0
  point_beta: 1.0
  affine_grid_h: 16
  affine_grid_w: 16
  anchors_per_pair: 256
  max_pairs: 12
  sample_from_valid_only: true
  center_consistency_enable: true
  scale_min: 1.0e-4
  scale_max: 0.5

optim:
  type: adamw
  base_lr: 1.0e-4
  backbone_lr_mult: 0.5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  scheduler: warmup_cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.05

train:
  max_epochs: 50
  accumulate_steps: 1
  grad_clip_norm: 1.0
  amp_dtype: fp16
  enable_grad_scaler: true
  enable_render_train: true
  enable_render_val: true
  skip_nan_batch: true
  log_interval: 20
  hist_interval: 200
  vis_interval: 500
  val_interval: 1000
  ckpt_interval: 1000
  save_every_epoch: true
  validate_first: false
  validate_each_epoch: true
  best_metric: loss_total
  best_mode: min
  max_train_steps_per_epoch: -1
  max_val_steps: -1
  device_sanity_check: false
  enable_fixed_monitor_cache: true

logging:
  tensorboard:
    enable: true
    log_dir: work_dirs/sat2world_default/tb
    enable_mesh: true
    image_max_views: 4
    max_pointcloud_points: 8192
    flush_secs: 30
    fixed_monitor_samples: 1
    record_histograms: true
    record_pointcloud: true

checkpoint:
  checkpoints_dir: work_dirs/sat2world_default/checkpoints
  save_last: true
  save_best: true
  best_metric_name: loss_total
  best_metric_mode: min
  keep_last_n: 5
  save_optimizer_state: true
  save_scheduler_state: true
