system:
  project_name: Sat2World
  experiment_name: default_exp
  work_dir: work_dirs/train_0414_0
  output_dir: work_dirs/train_0414_0
  seed: 42
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  device: cuda
  compile_model: false
  ddp_backend: nccl
  auto_resume: true
  checkpoint_match_by_shape: false
  checkpoint_load_model_only: true
  checkpoint_model_strict: true
  resume_path: "work_dirs/train_0413/checkpoints/last.pt"
  checkpoint_path: "work_dirs/train_0413/checkpoints/last.pt"
  eval_only: false

data:
  train:
    root: ./data/JAX_train
    max_view_num: 6
    min_view_num: 2
    samples_per_scene: 10
    min_views: 2
    apply_perturbation: true
    synthetic_perturbation_in_eval: true
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 12345
    reference_policy: first
    strict_same_hw: true
    crop_size: 512
    anchors_per_view_per_sample: 128
    fit_pinhole_in_dataset: true
    fit_pinhole_keep_diagnostics: false
    fit_pinhole_cfg:
      downsample: 8
      num_heights: 100
      height_low: -20.0
      height_high: 80.0
      focal: 100000.0
      use_ransac: true
      seed: 42
    perturb_cfg:
      tx_range: [ -20.0, 20.0 ]
      ty_range: [ -20.0, 20.0 ]
      scale_range: [ -0.0005, 0.0005 ]
      shear_range: [ -0.0005, 0.0005 ]
  val:
    root: ./data/JAX_val
    max_view_num: 6
    min_view_num: 2
    samples_per_scene: 1
    min_views: 10
    apply_perturbation: true
    synthetic_perturbation_in_eval: true
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 22345
    reference_policy: first
    strict_same_hw: true
    crop_size: 512
    anchors_per_view_per_sample: 128
    fit_pinhole_in_dataset: true
    fit_pinhole_keep_diagnostics: false
    fit_pinhole_cfg:
      downsample: 8
      num_heights: 100
      height_low: -20.0
      height_high: 80.0
      focal: 100000.0
      use_ransac: true
      seed: 42
    perturb_cfg:
      tx_range: [ -20.0, 20.0 ]
      ty_range: [ -20.0, 20.0 ]
      scale_range: [ -0.0005, 0.0005 ]
      shear_range: [ -0.0005, 0.0005 ]
  test:
    root: ./data/JAX_val
    crop_size: 512
  loader:
    batch_size: 1
    val_batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true

geometry:
  rpc_dtype: float64
  net_dtype: float32

model:
  dino_weight_path: "./weights/dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth"
  pretrained: true
  freeze_backbone: true
  patch_size: 16
  embed_dim: 1024
  geometry_token_dim: 256
  fusion_dim: 1024
  encoder_depth: 24
  encoder_num_scene_tokens: 4
  nce_layer_index: 5
  intermediate_layer_idx: [5, 11, 17, 23]
  dense_pos_embed: true
  dense_down_ratio: 1
  dense_frames_chunk_size: 8
  task_adapter_depth: 2
  nce_projector_dim: 256
  nce_projector_hidden_dim: 512
  encoder_num_heads: 8
  encoder_ffn_ratio: 4.0
  encoder_dropout: 0.0
  encoder_aa_order: [frame, global]
  encoder_aa_block_size: 1
  encoder_qkv_bias: true
  encoder_proj_bias: true
  encoder_ffn_bias: true
  encoder_qk_norm: true
  encoder_fused_attn: true
  encoder_rope_freq: 100.0
  encoder_drop_path_rate: 0.0
  encoder_layerscale_init_values: 0.01
  affine_diag_scale: 0.01
  affine_offdiag_scale: 0.01
  affine_trans_scale: 50.0
  height_bins: 33
  height_bin_size: 1.0
  height_fine_range: 0.5
  point_bins: 33
  point_bin_size_xy: 0.1
  point_bin_size_z: 1.0
  point_fine_range_xy: 0.05
  point_fine_range_z: 0.5
  center_downsample_stage_steps: [0, 10, 20]
  center_downsample_factors: [4, 2, 1]
  enable_gaussian_branch: true
  sh_dim: 48
  gaussian_scale_epsilon: 1.0e-4
  output_raw_logits: true

renderer:
  train_num_target_views: 3
  val_num_target_views: 1
  use_all_targets_in_val: false
  exclude_self_source: true
  allow_self_source_if_single_view: true
  source_stride: 1
  confidence_threshold: 0.1
  topk_per_target: 10000000000
  enable_voxelization: false
  voxel_xy: 2.0
  voxel_z: 1.0
  render_downsample_factor_train: 2
  render_downsample_factor_val: 2
  nsigma: 2.5
  alpha_clamp_max: 0.98
  eps_xy_fd: 0.01
  eps_h_fd: 0.1
  eps_cov: 1.0e-4
  depth_dir_delta_h: 10.0
  depth_sort_descending: false
  chunk_size: 512
  alpha_cov_thresh: 0.05
  render_compute_dtype: fp16
  deterministic_target_selection: true
  target_selection_mode: random
  target_selection_seed_offset: 0
  render_backend: cuda
  cuda_backend_allow_fallback: true

loss:
  warmup_steps_geom_only: 10
  render_ramp_steps: 500
  stage1_steps: 10
  stage2_steps: 500
  ramp_mode: linear
  lambda_affine_grid: 1.0
  lambda_affine_pair: 1.0
  lambda_affine_reg: 0.1
  lambda_affine_ref: 0.1
  lambda_height: 1.0
  abs_keep_steps: 5000
  lambda_height_rel: 1.0
  lambda_height_rel_consistency: 1.0
  lambda_height_rel_cycle: 1.0
  height_rel_beta: 1.0
  height_rel_anchors_per_pair: 256
  height_rel_max_pairs: 12
  height_rel_sample_from_valid_only: true
  lambda_point: 1.0
  lambda_point_reproj: 0.2
  lambda_point_pair: 0.2
  lambda_normal_height: 10.0
  lambda_normal_point: 10.0
  lambda_feature_nce: 1.0
  normal_w_cos: 1.0
  normal_w_l1: 0.5
  normal_eps: 1.0e-6
  normal_sign_invariant: true
  normal_detach_gt: true
  lambda_center: 0.5
  lambda_opacity_reg: 0.01
  lambda_scale_reg: 0.01
  lambda_render_rpc: 1.0
  lambda_render_point: 1.0
  render_rgb_l1: 1.0
  render_rgb_ssim: 0.2
  render_height: 0.5
  render_alpha: 0.01
  feature_nce_temperature: 0.1
  feature_nce_max_pairs: 4096
  point_pair_grid_h: 64
  point_pair_grid_w: 64
  height_beta: 1.0
  point_beta: 1.0
  affine_grid_h: 16
  affine_grid_w: 16
  anchors_per_pair: 256
  max_pairs: 12
  sample_from_valid_only: true
  center_consistency_enable: true
  scale_min: 1.0e-4
  scale_max: 0.5

optim:
  type: adamw
  base_lr: 5.0e-5
  backbone_lr_mult: 0.5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  scheduler: warmup_cosine
  warmup_steps: 1000
  max_steps: 20000
  min_lr_ratio: 0.01

train:
  max_epochs: 200
  accumulate_steps: 1
  grad_clip_norm: 1.0
  amp_dtype: fp16
  enable_grad_scaler: true
  enable_render_train: true
  enable_render_val: true
  skip_nan_batch: true
  log_interval: 1
  hist_interval: 200
  vis_interval: 50
  val_interval: 10
  ckpt_interval: 1000
  save_every_epoch: true
  validate_first: true
  validate_each_epoch: true
  best_metric: loss_total
  best_mode: min
  max_train_steps_per_epoch: -1
  max_val_steps: -1
  device_sanity_check: false
  enable_fixed_monitor_cache: true

logging:
  tensorboard:
    enable: true
    log_dir: work_dirs/train_0414_0/tb
    enable_mesh: true
    image_max_views: 4
    max_pointcloud_points: 8192
    flush_secs: 30
    fixed_monitor_samples: 1
    record_histograms: true
    record_pointcloud: true

checkpoint:
  checkpoints_dir: work_dirs/train_0414_0/checkpoints
  save_last: true
  save_best: true
  best_metric_name: loss_total
  best_metric_mode: min
  keep_last_n: 5
  save_optimizer_state: true
  save_scheduler_state: true
