  lambda_affine_pair: 0.0
  lambda_affine_reg: 0.0
  lambda_height: 0.0
  lambda_height_anchor: 0.0
  abs_keep_steps: 100000
  lambda_point: 0.0
  lambda_height_meter_aux: 0.0
  lambda_height_anchor_meter_aux: 0.0
  lambda_point_pair: 0.0
  lambda_height_reproj: 0.0
  lambda_point_reproj: 0.0
  lambda_normal_height: 0.0
  lambda_patch_match: 0.5
  match_max_pair: 12
  patch_match_subpix_weight: 0.25
  patch_match_max_pairs: 4096
  normal_w_cos: 1.0
  normal_w_l1: 0.5
  normal_eps: 1.0e-06
  normal_sign_invariant: true
  normal_detach_gt: true
  lambda_feature_nce: 10.0
  feature_nce_temperature: 0.1
  feature_nce_max_pairs: 4096
  point_pair_grid_h: 64
  point_pair_grid_w: 64
  height_beta: 1.0
  height_z_beta_meter: 1.0
  height_anchor_z_beta_meter: 1.0
  point_beta: 1.0
  affine_grid_h: 16
  affine_grid_w: 16
  anchors_per_pair: 256
  max_pairs: 12
  sample_from_valid_only: true
  lambda_match_coord: 1.0
  lambda_projection: 1.0
  lambda_early_height: 1.0
  lambda_match_ce: 1.0
  lambda_match_cycle: 0.0
  pixel_loss_norm: 16.0
  early_height_scale: 1000.0
optim:
  type: adamw
  base_lr: 2.0e-05
  backbone_lr_mult: 0.5
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  scheduler: warmup_cosine
  warmup_steps: 600
  max_steps: 30000
  min_lr_ratio: 0.01
train:
  max_epochs: 200
  accumulate_steps: 2
  grad_clip_norm: 1.0
  grad_clip_mode: grouped
  grad_clip_group_norm: 1.0
  amp_dtype: bf16
  enable_grad_scaler: false
  enable_render_train: false
  enable_render_val: false
  skip_nan_batch: true
  log_interval: 1
  hist_interval: 100000
  vis_interval: 100
  val_interval: 1000000
  ckpt_interval: 1000000
  save_every_epoch: true
  validate_first: false
  validate_each_epoch: true
  best_metric: loss_total
  best_mode: min
  max_train_steps_per_epoch: -1
  max_val_steps: -1
  device_sanity_check: false
  enable_fixed_monitor_cache: true
