system:
  project_name: Sat2World
  experiment_name: default_exp
  work_dir: work_dirs/early_pretrain_0428_1
  output_dir: work_dirs/early_pretrain_0428_1
  seed: 2604281
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  device: cuda
  compile_model: false
  ddp_backend: nccl
  auto_resume: false
  checkpoint_match_by_shape: true
  checkpoint_load_model_only: true
  checkpoint_model_strict: false
  resume_path: ''
  checkpoint_path: ''
  eval_only: false
data:
  train:
    root: ./data/JAX_train
    max_view_num: 2
    min_view_num: 2
    samples_per_scene: 20
    min_views: 2
    apply_perturbation: true
    synthetic_perturbation_in_eval: true
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 2604281
    reference_policy: first
    strict_same_hw: true
    crop_size: 256
    anchors_per_view_per_sample: 128
    fit_pinhole_in_dataset: false
    fit_pinhole_keep_diagnostics: false
    perturb_cfg:
      tx_range:
      - -5.0
      - 5.0
      ty_range:
      - -5.0
      - 5.0
      scale_range:
      - -0.0001
      - 0.0001
      shear_range:
      - -0.0001
      - 0.0001
    augment:
      color_jitter:
        enable: true
        p: 0.8
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.02
        same_across_views: false
  val:
    root: ./data/JAX_val
    max_view_num: 2
    min_view_num: 2
    samples_per_scene: 1
    min_views: 2
    apply_perturbation: true
    synthetic_perturbation_in_eval: true
    cache_rpc: true
    cache_image: false
    cache_height: false
    base_seed: 7618
    reference_policy: first
    strict_same_hw: true
    crop_size: 256
    anchors_per_view_per_sample: 128
    fit_pinhole_in_dataset: false
    fit_pinhole_keep_diagnostics: false
    perturb_cfg:
      tx_range:
      - -5.0
      - 5.0
      ty_range:
      - -5.0
      - 5.0
      scale_range:
      - -0.0001
      - 0.0001
      shear_range:
      - -0.0001
      - 0.0001
    augment:
      color_jitter:
        enable: false
        p: 0.0
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.02
        same_across_views: false
  test:
    root: ./data/JAX_val
    crop_size: 256
  loader:
    batch_size: 1
    val_batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
geometry:
  rpc_dtype: float64
  net_dtype: float32
model:
  dino_weight_path: ./weights/dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth
  pretrained: true
  freeze_backbone: true
  patch_size: 16
  embed_dim: 1024
  geometry_token_dim: 256
  fusion_dim: 1024
  encoder_depth: 8
  encoder_num_scene_tokens: 4
  intermediate_layer_idx:
  - 5
  - 11
  - 17
  - 23
  dense_pos_embed: true
  dense_down_ratio: 1
  dense_frames_chunk_size: 8
  task_adapter_depth: 2
  nce_layer_index: 3
  nce_projector_dim: 256
  nce_projector_hidden_dim: 512
  detail_patch_encoder_enable: true
  detail_patch_size: 16
  detail_token_dim: 1024
  patch_match_dim: 256
  patch_match_heads: 4
  patch_match_layers: 2
  encoder_num_heads: 8
  encoder_ffn_ratio: 4.0
  encoder_dropout: 0.0
  encoder_aa_order:
